
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>طلبياتي</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #172033;
    }
    header {
      background: #164bba;
      color: white;
      padding: 24px;
      text-align: center;
    }
    main {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 15px;
      box-shadow: 0 2px 8px #0001;
    }
    button {
      background: #164bba;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 9px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>📦 طلبياتي</h1>
    <p>نظام إدارة طلبات متعدد المتاجر</p>
  </header>
  <main>
    <div class="card">
      <h2>مرحبًا بك 👋</h2>
      <p>واجهة تطبيق طلبياتي جاهزة للتطوير.</p>
    </div>
    <div class="card">
      <h2>🏪 المتاجر</h2>
      <p>إدارة المتاجر والموظفين</p>
    </div>
    <div class="card">
      <h2>📋 الطلبات</h2>
      <p>متابعة الطلبات وحالات التوصيل</p>
    </div>
  </main>
</body>
</html>
