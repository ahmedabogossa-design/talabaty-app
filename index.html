
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلبياتي</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#172033}
header{background:#2458d3;color:white;text-align:center;padding:24px}
header h1{margin:0 0 8px}
main{max-width:500px;margin:25px auto;padding:15px}
.card{background:white;border-radius:15px;padding:22px;margin-bottom:15px;box-shadow:0 3px 12px #0001}
input,button{width:100%;padding:13px;margin:8px 0;border-radius:9px;font-size:16px}
input{border:1px solid #ccc}
button{border:0;background:#2458d3;color:white;cursor:pointer}
button:disabled{opacity:.6}
.secondary{background:#e8edfa;color:#2458d3}
#message{line-height:1.7}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>📦 طلبياتي</h1>
<p>نظام إدارة طلبيات متعدد المتاجر</p>
</header>
<main>
<section id="auth" class="card">
<h2>🔐 تسجيل الدخول</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
<input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password">
<button id="loginBtn" onclick="login()">تسجيل الدخول</button>
<button class="secondary" onclick="signup()">إنشاء حساب جديد</button>
<p id="message"></p>
</section>
<section id="dashboard" class="card hidden">
<h2>👋 مرحبًا بك في طلبياتي</h2>
<p id="userEmail"></p>
<div class="card">
<h3>🏪 المتاجر</h3>
<p>قريبًا: إدارة المتاجر والموظفين.</p>
</div>
<div class="card">
<h3>📋 الطلبات</h3>
<p>
<input id="storeName" type="text" placeholder="اكتب اسم المتجر الجديد">

<button onclick="addStore()">➕ إضافة متجر جديد</button>

<p id="storeMessage"></p>

<h3>🏪 متاجري</h3>
<div id="storesList">جاري تحميل المتاجر...</div>
</p>
</div>
<button class="secondary" onclick="logout()">تسجيل الخروج</button>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://lhspblemnlwchusvdjav.supabase.co";
const SUPABASE_KEY = "sb_publishable_rjnpHHB3RN4-yfOR29wJxA_2SZkPwbn";
const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function showMessage(text) {
  document.getElementById("message").textContent = text;
}

function showUser(user) {
  document.getElementById("auth").classList.toggle("hidden", !!user);
  document.getElementById("dashboard").classList.toggle("hidden", !user);
  document.getElementById("userEmail").textContent = user?.email || "";
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) {
    showMessage("اكتب البريد الإلكتروني وكلمة المرور");
    return;
  }
  showMessage("جاري تسجيل الدخول...");
  const {error} = await client.auth.signInWithPassword({email,password});
  if (error) showMessage("تعذر تسجيل الدخول: " + error.message);
  else showMessage("");
}

async function signup() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || password.length < 6) {
    showMessage("اكتب بريدًا صحيحًا وكلمة مرور من 6 أحرف على الأقل");
    return;
  }
  showMessage("جاري إنشاء الحساب...");
  const {data,error} = await client.auth.signUp({email,password});
  if (error) {
    showMessage("تعذر إنشاء الحساب: " + error.message);
  } else if (!data.session) {
    showMessage("تم طلب إنشاء الحساب. افتح بريدك الإلكتروني لتأكيد الحساب.");
  } else {
    showMessage("تم إنشاء الحساب بنجاح");
  }
}

async function logout() {
  const {error} = await client.auth.signOut();
  if (error) showMessage(error.message);
}

client.auth.onAuthStateChange((_event,session) => {
  showUser(session?.user || null);
});

client.auth.getUser().then(({data}) => {
  showUser(data.user);
}).catch(() => {
  showMessage("تعذر الاتصال بقاعدة البيانات");
});
</script>
</body>
</html>
